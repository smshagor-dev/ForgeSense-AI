name: Calibration diagnostic stream checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  diagnostic-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install pytest
      - name: Verify host capture and safety contract
        run: make calibration-diagnostic-check

  diagnostic-vhdl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install GHDL
        run: |
          sudo apt-get update
          sudo apt-get install -y ghdl
      - name: Analyze calibration image and transmitter
        run: |
          ghdl -a --std=08 fpga/rtl/protocol/crc16_ccitt_pkg.vhd
          ghdl -a --std=08 fpga/rtl/io/i2c_byte_engine.vhd
          ghdl -a --std=08 fpga/rtl/io/spi_mode0_byte_engine.vhd
          ghdl -a --std=08 fpga/rtl/io/spi_mode1_byte_engine.vhd
          ghdl -a --std=08 fpga/rtl/io/uart_tx.vhd
          ghdl -a --std=08 fpga/rtl/sensing/sample_scheduler.vhd
          ghdl -a --std=08 fpga/rtl/sensing/timebase_ms.vhd
          ghdl -a --std=08 fpga/rtl/sensing/sensor_device_math_pkg.vhd
          ghdl -a --std=08 fpga/rtl/sensing/tmp117_controller.vhd
          ghdl -a --std=08 fpga/rtl/sensing/adxl355_controller.vhd
          ghdl -a --std=08 fpga/rtl/sensing/ads131m02_controller.vhd
          ghdl -a --std=08 fpga/rtl/protocol/calibration_diag_tx.vhd
          ghdl -a --std=08 fpga/rtl/top/forgesense_tang_nano_9k_calibration_top.vhd
          ghdl -a --std=08 fpga/tb/tb_calibration_diag_tx.vhd
          ghdl -e --std=08 tb_calibration_diag_tx
          ghdl -r --std=08 tb_calibration_diag_tx --assert-level=error --stop-time=20us
