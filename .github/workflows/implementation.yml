name: Implementation checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-reference:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run Python regression tests
        env:
          PYTHONPATH: simulator:ml:protocol/python
        run: python -m pytest
      - name: Verify generated embedded model
        env:
          PYTHONPATH: simulator:ml:protocol/python
        run: |
          python tools/export_reference_model.py --out build/reference_model.h
          diff -u firmware/components/forgesense_inference/include/forgesense_reference_model_generated.h build/reference_model.h
      - name: Run virtual anomaly demo
        env:
          PYTHONPATH: simulator:ml:protocol/python
        run: python tools/run_virtual_demo.py
      - name: Run closed-loop control demo
        env:
          PYTHONPATH: simulator:ml:protocol/python
        run: python tools/run_closed_loop.py
      - name: Run deterministic validation matrix
        env:
          PYTHONPATH: simulator:ml:protocol/python
        run: python tools/run_validation_matrix.py

  firmware-host:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Compile and run portable embedded checks
        run: make firmware-host

  vhdl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install GHDL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ghdl
      - name: Analyze RTL
        run: |
          ghdl -a --std=08 fpga/rtl/safety/safety_pkg.vhd
          ghdl -a --std=08 fpga/rtl/safety/watchdog.vhd
          ghdl -a --std=08 fpga/rtl/safety/hard_limit_monitor.vhd
          ghdl -a --std=08 fpga/rtl/safety/safety_fsm.vhd
          ghdl -a --std=08 fpga/rtl/protocol/crc16_ccitt_pkg.vhd
          ghdl -a --std=08 fpga/rtl/protocol/link_receiver.vhd
          ghdl -a --std=08 fpga/rtl/protocol/intelligence_gate.vhd
          ghdl -a --std=08 fpga/rtl/protocol/sensor_link_tx.vhd
          ghdl -a --std=08 fpga/rtl/io/uart_rx.vhd
          ghdl -a --std=08 fpga/rtl/io/uart_tx.vhd
          ghdl -a --std=08 fpga/rtl/sensing/sample_scheduler.vhd
          ghdl -a --std=08 fpga/rtl/sensing/timebase_ms.vhd
          ghdl -a --std=08 fpga/rtl/top/safety_core.vhd
          ghdl -a --std=08 fpga/rtl/top/forgesense_core.vhd
          ghdl -a --std=08 fpga/rtl/top/forgesense_platform_core.vhd
          ghdl -a --std=08 fpga/rtl/top/forgesense_board_core.vhd
      - name: Run safety state testbench
        run: |
          ghdl -a --std=08 fpga/tb/tb_safety_fsm.vhd
          ghdl -e --std=08 tb_safety_fsm
          ghdl -r --std=08 tb_safety_fsm --assert-level=error
      - name: Run ML frame receiver testbench
        run: |
          ghdl -a --std=08 fpga/tb/tb_link_receiver.vhd
          ghdl -e --std=08 tb_link_receiver
          ghdl -r --std=08 tb_link_receiver --assert-level=error
      - name: Run sensor frame transmitter testbench
        run: |
          ghdl -a --std=08 fpga/tb/tb_sensor_link_tx.vhd
          ghdl -e --std=08 tb_sensor_link_tx
          ghdl -r --std=08 tb_sensor_link_tx --assert-level=error
      - name: Run first-critical startup integration testbench
        run: |
          ghdl -a --std=08 fpga/tb/tb_platform_startup_critical.vhd
          ghdl -e --std=08 tb_platform_startup_critical
          ghdl -r --std=08 tb_platform_startup_critical --assert-level=error
