name: Bug report
description: Report a reproducible defect that is not a security vulnerability
title: "bug: "
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here. Follow SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is wrong?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Give deterministic steps, inputs, seeds, traces, or hardware revision where possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: dropdown
    id: subsystem
    attributes:
      label: Subsystem
      options:
        - FPGA / VHDL
        - Firmware
        - ML / data
        - Simulator
        - Protocol
        - Hardware / PCB
        - Dashboard
        - Documentation / tooling
        - Cross-system
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety impact
      description: Could this affect output enable, shutdown, interlocks, limits, reset, or fault recovery?
    validations:
      required: true
